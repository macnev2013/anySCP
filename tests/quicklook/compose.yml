# Isolated, loopback-only fixtures for native-host adapter tests.
name: anyscp-quicklook
services:
  sftp:
    image: lscr.io/linuxserver/openssh-server:latest
    environment:
      USER_NAME: testuser
      USER_PASSWORD: testpass
      PASSWORD_ACCESS: "true"
    ports: ["127.0.0.1:24222:2222"]
  scp-gnu:
    build: ../scp-server
    environment:
      USER_NAME: testuser
      USER_PASSWORD: testpass
      PASSWORD_ACCESS: "true"
    ports: ["127.0.0.1:24223:2222"]
  scp-busybox:
    build: ../scp-server-busybox
    ports: ["127.0.0.1:24224:2222"]
  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    entrypoint: ["minio"]
    command: ["server", "/tmp/data"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["127.0.0.1:24900:9000"]
